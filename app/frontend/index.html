<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Assessment</title>
    <style>
        body, html {
            height: 100%; margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #ffffff;
        }
        #status-text {
            font-size: 4rem; letter-spacing: 0.3rem; text-shadow: 0 10px 20px rgba(0,0,0,0.5); margin: 0;
            transition: color 0.5s ease;
        }
        .loading { color: #cccccc; font-size: 2rem !important; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        #details { margin-top: 20px; font-family: monospace; color: #94a3b8; font-size: 1rem; text-align: center;}
    </style>
</head>
<body>
    <h1 id="status-text" class="loading">VERIFYING INFRASTRUCTURE...</h1>
    <div id="details"></div>

    <script>
        // Use relative path for ALB routing, or localhost for local Docker
        const apiUrl = window.location.hostname === 'localhost' ? 'http://localhost:3000/health' : '/api/health';

        fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error('Backend HTTP Error');
                return response.json();
            })
            .then(data => {
                const el = document.getElementById('status-text');
                const details = document.getElementById('details');
                
                if(data.database === 'CONNECTED') {
                    el.innerText = 'SUCCESS';
                    el.className = 'success';
                    details.innerText = `Backend: UP | Database: CONNECTED`;
                } else {
                    throw new Error('Database not connected');
                }
            })
            .catch(error => {
                const el = document.getElementById('status-text');
                el.innerText = 'INFRASTRUCTURE ERROR';
                el.className = 'error';
                document.getElementById('details').innerText = 'Could not establish full 3-tier connectivity.';
            });
    </script>
</body>
</html>
