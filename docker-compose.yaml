
services:
  db:
    image: mysql:8.0
    container_name: devops-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: devopsdb
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpassword
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    container_name: devops-frontend
    restart: unless-stopped

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    container_name: devops-backend
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=db
      - DB_USER=dbuser
      - DB_PASS=dbpassword
      - DB_NAME=devopsdb
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped