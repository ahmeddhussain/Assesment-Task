name: "Application Build, SecScan & Deploy"

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/app-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write # AWS OIDC + Cosign keyless signing
  contents: read

# Never run two deployments at once
concurrency:
  group: app-deploy
  cancel-in-progress: false

env:
  AWS_REGION: "us-east-1"
  ENVIRONMENT: "dev"

jobs:
  # ------------------------------------------------------------------
  # 1. TEST
  # ------------------------------------------------------------------
  test-application:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22 # same major version as the Docker image
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: "Run Backend Tests"
        working-directory: app/backend
        run: |
          npm ci
          npm test

  # ------------------------------------------------------------------
  # 2. BUILD -> SCAN -> PUSH -> SIGN (one job per image)
  # ------------------------------------------------------------------
  build-scan-sign:
    name: "Build, Scan & Sign (${{ matrix.service }})"
    needs: test-application
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [backend, frontend]
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Install Cosign"
        uses: sigstore/cosign-installer@v3.4.0

      - name: "Assume AWS Role via OIDC (no stored AWS keys)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: "sts.amazonaws.com"

      - name: "Login to Amazon ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: "Build Image"
        working-directory: app/${{ matrix.service }}
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ENVIRONMENT }}-${{ matrix.service }}
        run: docker build -t "$IMAGE:$IMAGE_TAG" .

      - name: "Trivy Scan (fails on CRITICAL)"
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ENVIRONMENT }}-${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: "Push & Sign Image"
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ENVIRONMENT }}-${{ matrix.service }}
        run: |
          # Immutable SHA tag = what gets deployed; :latest is only the Terraform bootstrap tag
          docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:latest"
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"

          # Sign the pushed digest (keyless, via the GitHub OIDC identity)
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$IMAGE_TAG")
          cosign sign --yes "$DIGEST"

  # ------------------------------------------------------------------
  # 3. DEPLOY (only after BOTH images passed test + scan + push)
  # ------------------------------------------------------------------
  deploy:
    name: "Deploy (${{ matrix.service }})"
    needs: build-scan-sign
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: "Assume AWS Role via OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: "sts.amazonaws.com"

      - name: "Login to Amazon ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: "Download current task definition"
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ env.ENVIRONMENT }}-${{ matrix.service }}-task" \
            --query taskDefinition > task-definition.json

      - name: "Render task definition with the new image (:git-sha)"
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.service }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ENVIRONMENT }}-${{ matrix.service }}:${{ github.sha }}

      - name: "Deploy to ECS (rolling update, waits for stability, auto-rollback on failure)"
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ENVIRONMENT }}-ecs-cluster
          service: ${{ env.ENVIRONMENT }}-${{ matrix.service }}-service
          wait-for-service-stability: true
